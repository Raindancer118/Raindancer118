<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 384" width="1160" height="384" role="img" aria-label="Tom Stieh, Wirtschaftsinformatik, Hamburg. Werkzeuge, mit denen KI-Agenten kontrolliert mit echten Systemen arbeiten. Offen für Einstiegsstellen ab April 2027.">
  <title>Tom Stieh</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2c30"/><stop offset="1" stop-color="#1b1c1f"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcdde0"/><stop offset="1" stop-color="#a9acb1"/></linearGradient>
    
  </defs>

  <g font-family="Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="84" font-size="22" fill="#85858b">Wirtschaftsinformatik · Hamburg</text>
    <text x="-4" y="170" font-size="84" font-weight="500" letter-spacing="-2" fill="#ededed">Tom Stieh</text>
    <text x="0" y="230" font-size="27" fill="#a1a1a6">Werkzeuge, mit denen KI-Agenten kontrolliert</text>
    <text x="0" y="266" font-size="27" fill="#a1a1a6">mit echten Systemen arbeiten</text>
    <circle cx="7" cy="325" r="6" fill="#5fbf94"/>
    <text x="26" y="333" font-size="22" fill="#a1a1a6">Offen für Einstiegsstellen ab April 2027</text>
  </g>

  <g transform="translate(680 48)">
