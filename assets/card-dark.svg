    <rect x="0.5" y="0.5" width="455" height="287" rx="19.5" fill="none" stroke="rgba(255,255,255,0.10)"/>
    <g font-family="Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="28" y="48" font-size="20" font-weight="500" fill="#ededed">tstieh</text>
      <text x="428" y="48" font-size="16" text-anchor="end" fill="#8d9097">B.Sc. Wirtschaftsinformatik</text>
    </g>
    <rect x="28" y="92" width="52" height="40" rx="8" fill="url(#chip)"/>
    <g stroke="#8f9298" stroke-width="1" fill="none">
