      <text x="428" y="230" font-size="16" text-anchor="end" fill="#8d9097">Verfügbar ab</text>
    </g>
    <text x="428" y="260" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" text-anchor="end" fill="#ededed">04/2027</text>
