    <text x="28" y="190" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" letter-spacing="3" fill="#e4e4e6">raindancer118</text>
    <g font-family="Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="28" y="230" font-size="16" fill="#8d9097">Inhaber</text>
